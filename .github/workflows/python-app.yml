# Проверка кода: линтер, известные уязвимости зависимостей, тесты.
# Ничего не чинит на месте: ошибка ruff, неформатированный файл или уязвимый пакет -
# красный CI, а не тихо исправленная копия на раннере.

name: Soroka bot

on:
  push:
    branches: [ "main", "dev" ]
  # dev - сюда идут PR Dependabot (.github/dependabot.yml)
  pull_request:
    branches: [ "main", "dev" ]
  # новые уязвимости публикуют без нашего коммита - раз в неделю проверка сама
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Ruff check
      run: ruff check . --output-format=github

    - name: Ruff format
      run: ruff format --check --diff .

  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: pip-audit
      # по файлам, а не по окружению: в образ едет ровно requirements.txt;
      # --strict - пакет, который не удалось разобрать, тоже ошибка
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit==2.10.1
        pip-audit --strict -r requirements.txt
        pip-audit --strict -r requirements-dev.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 - как в образе (Dockerfile), 3.12 - заранее к переходу
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Test with pytest
      env:
        BOT_TOKEN: test_token
        DATABASE_URL: postgresql+asyncpg://test
      # настройки - в pytest.ini
      run: |
        pytest --junitxml=test-results-${{ matrix.python-version }}.xml -v --tb=short

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results-${{ matrix.python-version }}.xml
        retention-days: 7

  migrations:
    # тесты базы в job test - на SQLite, а боевая база - PostgreSQL 15
    # (docker-compose.yml): ревизии Alembic и create_all сверяются на нём
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          # одноразовая база раннера, наружу не видна
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Migrations on PostgreSQL 15
      env:
        BOT_TOKEN: test_token
        DATABASE_URL: postgresql+asyncpg://test
        TEST_POSTGRES_URL: postgresql+asyncpg://postgres@localhost:5432/postgres
        # без адреса базы тесты PostgreSQL - ошибка, а не тихий пропуск
        REQUIRE_POSTGRES: "1"
      run: pytest tests/test_migrations.py -v --tb=short
