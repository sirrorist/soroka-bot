# Тексты бота на русском. Все сообщения правятся здесь, а не в коде.
# Разметка - HTML Telegram: <b>, <i>, <code>, <blockquote>, <a href>.
# {имя} - подстановка из кода: не удалять и не переименовывать.
# Обращение - "Вы" с заглавной; эмодзи - только там, где они метка (⭐ ⏳ 🎮 🔒 ⚠️ ✅ 📊 👋).

