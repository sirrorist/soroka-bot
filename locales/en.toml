Send a link or forward a message that has one.
Videos up to 20 minutes and {max_mb} MB.

<b>Commands</b>
<blockquote><code>/dl link</code> - download
/stats - what's used and what's left
/premium - about Premium
<code>/sdate profile</code> - Steam hours for two weeks
/language - bot language
/about - about the bot</blockquote>

<b>In groups</b>
Add the bot to a chat. There it only answers commands starting with <b>{p}</b>:
<code>/{p}dl link</code>, /{p}help."""

