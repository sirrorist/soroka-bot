[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py *_test.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# --strict-config: опечатка в этом файле - ошибка, а не тихо пропущенная настройка
# (так раньше не действовал весь файл: секция была [tool:pytest] от setup.cfg);
# no:cacheprovider - не оставлять .pytest_cache в клоне
addopts = --strict-markers --strict-config -p no:cacheprovider
junit_family = xunit2
# предупреждение - ошибка: устаревшее API в зависимостях всплывает в PR Dependabot,
# а не после того, как версия его уберёт
filterwarnings = error
