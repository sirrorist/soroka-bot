services:
  # Отдельный счётчик: только профиль sobriety, отдельный токен и SQLite.
  sobriety:
    build:
      context: .
      dockerfile: Dockerfile.sobriety
    profiles: ["sobriety"]
    restart: unless-stopped
    env_file:
      # Пустой шаблон существует и не ломает обычный compose без нового профиля.
      # Для запуска счётчика владелец задаёт отдельный секретный SOBRIETY_ENV_FILE.
      - ${SOBRIETY_ENV_FILE:-./sobriety.env.example}
    environment:
      - SOBRIETY_DB_PATH=/data/sobriety.sqlite3
    volumes:
      - sobriety_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    pids_limit: 32
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - sobriety-network

  bot:
    build: .
    container_name: tiktube_download_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - ./temp:/app/temp
      - ./storage:/app/storage
      - ./logs:/app/logs
    # Только loopback: снаружи webhook доступен через обратный прокси.
    # Порт, опубликованный Docker на 0.0.0.0, идёт мимо ufw
    ports:
      - "127.0.0.1:8001:8001"
    # Один пользователь не должен съесть память и процессы всего хоста
    mem_limit: 1g
    pids_limit: 256
    # Права root нужны только entrypoint: отдать каталоги и сбросить root
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # Старый @tiktubeDownloadBot после переезда в Soroka: на всё отвечает, что бот
  # переехал (redirect_bot.py). Только по профилю: docker compose --profile moved up -d
  redirect:
    build: .
    container_name: tiktube_redirect_bot
    restart: unless-stopped
    profiles: ["moved"]
    command: ["python", "redirect_bot.py"]
    environment:
      - OLD_BOT_TOKEN=${OLD_BOT_TOKEN}
      - NEW_BOT_USERNAME=${NEW_BOT_USERNAME}
      - MOVED_PHOTO=/app/moved/moved.png
    # отдельная папка, а не storage/: entrypoint делает chown -R storage/ и упал бы
    # на read-only. Нет картинки в ./moved/ - заглушка отвечает только текстом
    volumes:
      - ./moved:/app/moved:ro
    # заглушка - только стандартная библиотека: ~25 МБ (замер 2026-10-01); swap не
    # даётся (memswap_limit = mem_limit), утечка - OOM в логе, а не тихий swap
    mem_limit: 64m
    memswap_limit: 64m
    # один поток, без пула
    pids_limit: 16
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15-alpine
    container_name: tiktube_download_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: tiktube_download_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network
  
  # Не стартует по умолчанию: `docker compose --profile tools up -d adminer`,
  # открывать через SSH-туннель (ssh -L 8084:127.0.0.1:8084 ...)
  adminer:
    image: adminer:6.1.1-standalone
    container_name: tiktube_download_adminer
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
      - ADMINER_DESIGN=nette
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

volumes:
  sobriety_data:
  postgres_data:
  redis_data:

networks:
  sobriety-network:
    driver: bridge
  app-network:
    driver: bridge
