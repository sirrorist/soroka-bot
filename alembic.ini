# Миграции схемы базы. Адрес базы здесь не пишется: env.py берёт DATABASE_URL из
# настроек бота (config.py), как и сам бот, - пароль не попадает в файл.
# Команды - Docs (commands.md), в контейнере: alembic upgrade head

[alembic]
script_location = %(here)s/migrations
# корень репозитория в sys.path: env.py импортирует config и database
prepend_sys_path = .
path_separator = os
# имя файла ревизии: 0002_premium_until.py - по порядку, а не по случайному хэшу
file_template = %%(rev)s_%%(slug)s

# новая ревизия сразу в формате ruff, иначе CI (job lint) красный. Только для
# `alembic revision` на машине разработки: ruff - в requirements-dev.txt, не в образе
[post_write_hooks]
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
